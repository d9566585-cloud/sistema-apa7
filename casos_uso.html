<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagrama de Casos de Uso</title>
<style>
body {
    font-family: Arial;
    text-align: center;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 50px;
}

.actor {
    margin-right: 50px;
    text-align: center;
}

.system {
    border: 2px solid black;
    padding: 20px;
    width: 300px;
    border-radius: 10px;
}

.usecase {
    border: 1px solid black;
    border-radius: 20px;
    padding: 10px;
    margin: 10px;
}
</style>
</head>

<body>

<h2>Diagrama de Casos de Uso - Sistema APA</h2>

<div class="container">

    <!-- Actor -->
    <div class="actor">
        <p>👤</p>
        <p>Usuario</p>
    </div>

    <!-- Sistema -->
    <div class="system">
        <h3>Sistema APA</h3>

        <div class="usecase">Cargar documento</div>
        <div class="usecase">Analizar documento</div>
        <div class="usecase">Aplicar normas APA</div>
        <div class="usecase">Generar documento</div>
        <div class="usecase">Descargar documento</div>

    </div>

</div>

</body>
</html>
